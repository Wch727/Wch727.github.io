<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e9e6db"/><stop offset="1" stop-color="#f6f5ef"/></linearGradient><filter id="shadow"><feDropShadow dy="10" stdDeviation="15" flood-color="#27464d" flood-opacity=".10"/></filter></defs><rect width="1000" height="600" fill="url(#bg)"/><g filter="url(#shadow)"><rect x="92" y="64" width="392" height="476" rx="4" fill="#fffefa"/><rect x="490" y="64" width="416" height="476" rx="4" fill="#fffefa"/></g><path d="M487 70v464" stroke="#e0dbce" stroke-width="3"/><text x="128" y="121" fill="#33565c" font-size="35" font-family="ui-monospace,Consolas,monospace" >ICPC</text><text x="128" y="154" fill="#859184" font-size="15" font-family="ui-monospace,Consolas,monospace" >ALGORITHM NOTEBOOK</text><text x="128" y="217" fill="#68776c" font-size="19" font-family="ui-monospace,Consolas,monospace" >Data structures</text><text x="424" y="217" fill="#98a797" font-size="13" font-family="ui-monospace,Consolas,monospace" >01</text><text x="128" y="262" fill="#68776c" font-size="19" font-family="ui-monospace,Consolas,monospace" >Graph theory</text><text x="424" y="262" fill="#98a797" font-size="13" font-family="ui-monospace,Consolas,monospace" >02</text><text x="128" y="307" fill="#68776c" font-size="19" font-family="ui-monospace,Consolas,monospace" >Mathematics</text><text x="424" y="307" fill="#98a797" font-size="13" font-family="ui-monospace,Consolas,monospace" >03</text><text x="128" y="352" fill="#68776c" font-size="19" font-family="ui-monospace,Consolas,monospace" >Dynamic programming</text><text x="424" y="352" fill="#98a797" font-size="13" font-family="ui-monospace,Consolas,monospace" >04</text><text x="128" y="397" fill="#68776c" font-size="19" font-family="ui-monospace,Consolas,monospace" >Geometry</text><text x="424" y="397" fill="#98a797" font-size="13" font-family="ui-monospace,Consolas,monospace" >05</text><text x="128" y="442" fill="#68776c" font-size="19" font-family="ui-monospace,Consolas,monospace" >Strings</text><text x="424" y="442" fill="#98a797" font-size="13" font-family="ui-monospace,Consolas,monospace" >06</text><text x="528" y="122" fill="#33565c" font-size="21" font-family="ui-monospace,Consolas,monospace" >Disjoint Set Union</text><text x="528" y="182" fill="#4c8c86" font-size="16" font-family="ui-monospace,Consolas,monospace" xml:space="preserve">int find(int x) {</text><text x="528" y="211" fill="#657b7d" font-size="16" font-family="ui-monospace,Consolas,monospace" xml:space="preserve">  if (p[x] == x)</text><text x="528" y="240" fill="#657b7d" font-size="16" font-family="ui-monospace,Consolas,monospace" xml:space="preserve">    return x;</text><text x="528" y="269" fill="#657b7d" font-size="16" font-family="ui-monospace,Consolas,monospace" xml:space="preserve">  return p[x] =</text><text x="528" y="298" fill="#657b7d" font-size="16" font-family="ui-monospace,Consolas,monospace" xml:space="preserve">    find(p[x]);</text><text x="528" y="327" fill="#657b7d" font-size="16" font-family="ui-monospace,Consolas,monospace" xml:space="preserve">}</text><text x="528" y="356" fill="#657b7d" font-size="16" font-family="ui-monospace,Consolas,monospace" xml:space="preserve"></text><text x="528" y="385" fill="#657b7d" font-size="16" font-family="ui-monospace,Consolas,monospace" xml:space="preserve">void unite(int a, int b) {</text><text x="528" y="414" fill="#4c8c86" font-size="16" font-family="ui-monospace,Consolas,monospace" xml:space="preserve">  p[find(a)] = find(b);</text><text x="528" y="443" fill="#657b7d" font-size="16" font-family="ui-monospace,Consolas,monospace" xml:space="preserve">}</text></svg>